{% extends "base.html" %}

{% block content %}
<style>
    /* Absolute reset for Login Experience */
    #page-content-wrapper {
        margin-left: 0 !important;
        padding-top: 0 !important;
    }

    #sidebar-wrapper,
    .top-navbar,
    .app-bottom-nav,
    .app-footer {
        display: none !important;
    }

    .login-stage {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #0A0F1A;
        padding: 24px;
    }

    .login-box {
        width: 100%;
        max-width: 480px;
        background: #131A2A;
        border: 1px solid #1F2937;
        border-radius: 24px;
        padding: 48px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .dark .login-box {
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    .brand-mark {
        width: 48px;
        height: 48px;
        background: rgba(59, 130, 246, 0.1);
        color: #3B82F6;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        margin-bottom: 24px;
    }

    .login-title {
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -0.5px;
        margin-bottom: 8px;
        color: #FFFFFF;
    }

    .login-subtitle {
        color: #9CA3AF;
        font-size: 15px;
        margin-bottom: 32px;
    }

    .form-label {
        font-size: 13px;
        font-weight: 600;
        color: #9CA3AF;
        margin-bottom: 8px;
        display: block;
    }

    .form-input {
        width: 100%;
        padding: 12px 16px;
        background: #0A0F1A;
        border: 1px solid #1F2937;
        border-radius: 10px;
        color: #FFFFFF;
        font-size: 15px;
        transition: all 0.2s;
        margin-bottom: 20px;
    }

    .form-input:focus {
        outline: none;
        border-color: var(--accent-blue);
        box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
    }

    .btn-submit {
        width: 100%;
        padding: 14px;
        background: var(--accent-blue);
        color: white;
        border: none;
        border-radius: 10px;
        font-weight: 700;
        font-size: 15px;
        cursor: pointer;
        transition: transform 0.1s, opacity 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
    }

    .btn-submit:hover {
        opacity: 0.9;
    }

    .btn-submit:active {
        transform: scale(0.98);
    }

    .alt-action {
        text-align: center;
        margin-top: 24px;
        font-size: 14px;
        color: #9CA3AF;
    }

    .alt-action a {
        color: #3B82F6;
        text-decoration: none;
        font-weight: 600;
    }

    .auth-footer {
        margin-top: 48px;
        padding-top: 24px;
        border-top: 1px solid #1F2937;
        display: flex;
        justify-content: center;
        gap: 16px;
    }

    .auth-footer-item {
        font-size: 12px;
        color: #9CA3AF;
        display: flex;
        align-items: center;
        gap: 6px;
    }
</style>

<div class="login-stage">
    <div class="login-box">
        <div class="brand-mark">
            <i class="bi bi-droplet-fill"></i>
        </div>

        <h1 class="login-title">Sign in to JalScan</h1>
        <p class="login-subtitle">Securing India's water future with AI telemetry.</p>

        <form method="POST">
            <div>
                <label class="form-label" for="username">Access Identity</label>
                <input type="text" id="username" name="username" class="form-input" placeholder="Enter your username"
                    required>
            </div>

            <div>
                <label class="form-label" for="password">Security Key</label>
                <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-submit">
                Access Infrastructure <i class="bi bi-arrow-right"></i>
            </button>
        </form>

        <div class="alt-action">
            Reporting a local event? <a href="{{ url_for('public_upload') }}">Public Submission Feed</a>
        </div>

        <div class="auth-footer">
            <div class="auth-footer-item">
                <i class="bi bi-shield-lock"></i> AES-256 Verified
            </div>
            <div class="auth-footer-item">
                <i class="bi bi-cpu"></i> AI-Edge Ready
            </div>
        </div>
    </div>
</div>
{% endblock %}
